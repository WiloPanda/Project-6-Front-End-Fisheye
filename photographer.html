<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <!-- Styles -->
  <link href="css/reset.css" rel="stylesheet" type="text/css">
  <link href="css/photographer.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">


  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>Fisheye - photographe</title>
</head>

<body>
  <header>
    <a href="index.html" aria-label="Retour à la page d'accueil"><img src="assets/images/logo.png" class="logo"
        alt="fisheye logo" aria-label="fisheye logo"></a>
  </header>

  <main id="main">
    <div class="photographe_header">
    </div>

    <div class="filter_section">
      <label class="label">Trier par</label>
      <div class="select_container">
        <button id="dropdown_button" class="btn_drop" type="button" aria-haspopup="listbox" aria-expanded="false"
          aria-controls="dropdown_menu" aria-label="Trier par">
          <span id="current_filter">Popularité</span>
          <img src="/assets/icons/dropdown.png" alt="icône flèche permettant de déplier le filtre dropdown"
            aria-label="Trier par">
        </button>
        <div id="dropdown_menu">
          <ul id="dropdown_menu_hidden" role="listbox" aria-label="Trier par">
            <li class="dropdown_options" tabindex="0" role="option" aria-selected="true" aria-label="Popularité">
              Popularité
            </li>
            <li class="dropdown_options" tabindex="0" role="option" aria-label="Date">Date</li>
            <li class="dropdown_options" tabindex="0" role="option" aria-label="Titre">Titre</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="photographe_medias">
    </div>
  </main>
  <div id="contact_modal">
    <div class="modal">
      <header>
        <h1 class="modal_title">Contactez-moi</h1>
        <button class="close_modal" data-index="5" aria-label="Fermer le formulaire de contact"
          onclick="closeModal()"><img src="assets/icons/close.svg" alt="Fermer le formulaire"></button>
      </header>
      <form onsubmit="sendForm(event)">
        <div>
          <label for="firstname">Prenom</label>
          <input type="text" id="firstname" name="firstname" aria-label="Écrivez votre prénom" data-index="0" required>
          <label for="lastname">Nom</label>
          <input type="text" id="lastname" name="lastname" aria-label="Écrivez votre nom de famille" data-index="1"
            required>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" aria-label="Écrivez votre adresse mail" data-index="2" required>
          <label for="message">Message</label>
          <textarea id="message" name="message" aria-label="Écrivez votre message" cols="70" rows="10" data-index="3"
            required></textarea>
        </div>
        <button type="submit" class="contact_button" aria-label="Envoyer le formulaire" data-index="4"
          onclick="sendForm(event)">Envoyer</button>
      </form>
    </div>
  </div>
  <div id="medias_modal">
  </div>
  <!-- Scripts -->
  <script src="/scripts/pages/photographer.js"></script>
  <script src="/scripts/utils/contactForm.js"></script>
  <script src="/scripts/templates/photographersTemplate.js"></script>
  <script src="/scripts/models/MainMedia.js"></script>
  <script src="/scripts/models/ImageMedia.js"></script>
  <script src="/scripts/models/VideoMedia.js"></script>
  <script src="/scripts/utils/mediaModal.js"></script>
</body>

</html>
