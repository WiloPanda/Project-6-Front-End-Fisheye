<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <!-- Styles -->
  <link href="css/reset.css" rel="stylesheet" type="text/css" />
  <link href="css/photographer.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">


  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>Fisheye - photographe</title>
</head>

<body>
  <header>
    <img src="assets/images/logo.png" class="logo" alt="fisheye logo" aria-label="fisheye logo" />
  </header>

  <main id="main">
    <section class="photographe_header">
    </section>

    <div class="filter_section">
      <label class="label" for="select">Trier par</label>
      <div class="select_container">
        <button id="dropdown_button" class="btn_drop" type="button" role="button" aria-haspopup="listbox"
          aria-expanded="false" aria-controls="dropdown_menu" aria-label="Sort by">
          <span id="current_filter">Popularité</span>
          <img src="/assets/icons/dropdown.png" alt="icône flèche permettant de déplier le filtre dropdown"
            aria-label="Sort by" tabindex="0" />
        </button>
        <div id="dropdown_menu">
          <ul id="dropdown_menu_hidden">
            <li class="dropdown_options" tabindex="0" role="option" aria-selected="true" aria-label="Popularité"
              value="Popularité">Popularité
            </li>
            <li class="dropdown_options" tabindex="0" role="option" aria-label="Date" value="Date">Date</li>
            <li class="dropdown_options" tabindex="0" role="option" aria-label="Titre" value="Titre">Titre</li>
          </ul>
        </div>
      </div>
    </div>

    <section class="photographe_medias">
    </section>
  </main>
  <div id="contact_modal">
    <div class="modal">
      <header>
        <h1 class="modal_title">Contactez-moi</h1>
        <button class="close_modal" data-index="5" aria-label="Close dialog" onclick="closeModal()"><img
            src="assets/icons/close.svg" alt="Close modal" /></button>
      </header>
      <form onsubmit="sendForm(event)">
        <div>
          <label for="firstname">Prenom</label>
          <input type="text" id="firstname" name="firstname" aria-label="Write your first name" data-index="0"
            required />
          <label for="lastname">Nom</label>
          <input type="text" id="lastname" name="lastname" aria-label="Write your last name" data-index="1" required />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" aria-label="Write your email" data-index="2" required />
          <label for="message">Message</label>
          <textarea id="message" name="message" aria-label="Write your message" cols="70" rows="10" data-index="3"
            required></textarea>
        </div>
        <button type="submit" class="contact_button" aria-label="Send form" data-index="4"
          onclick="sendForm(event)">Envoyer</button>
      </form>
    </div>
  </div>
  <div id="medias_modal">
  </div>
</body>

<!-- Scripts -->
<script src="/scripts/pages/photographer.js" defer></script>
<script src="/scripts/templates/photographerProfileTemplate.js" defer></script>
<script src="/scripts/models/MainMedia.js" defer></script>
<script src="/scripts/utils/mediaModal.js" defer></script>

</html>
