<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!-- Styles -->
  <link href="css/reset.css" rel="stylesheet" type="text/css" />
  <link href="css/photographer.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet">

  <!-- Scripts -->
  <script src="/scripts/pages/photographer.js" defer></script>
  <script src="/scripts/templates/photographerProfileTemplate.js" defer></script>
  <script src="/scripts/models/MainMedia.js" defer></script>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>Fisheye - photographe</title>
</head>

<body>
  <header>
    <img src="assets/images/logo.png" class="logo" />
  </header>

  <main id="main">
    <section class="photographe_header">
    </section>

    <div class="filter_section">
      <label class="label" for="select">Trier par</label>
      <div class="select_container">
        <button id="dropdown_button" class="btn_drop" type="button" role="button" aria-haspopup="listbox"
          aria-expanded="false" aria-controls="dropdown_menu" aria-label="Sort by">
          <span id="current_filter">Popularité</span>
          <img src="/assets/icons/dropdown.png" alt="icône flèche permettant de déplier le filtre dropdown"
            tabindex="0" />
        </button>
        <div id="dropdown_menu">
          <ul id="dropdown_menu_hidden">
            <li class="dropdown_options" tabindex="0" role="option" aria-selected="true" value="Popularité">Popularité
            </li>
            <li class="dropdown_options" tabindex="0" role="option" value="Date">Date</li>
            <li class="dropdown_options" tabindex="0" role="option" value="Titre">Titre</li>
          </ul>
        </div>
      </div>
    </div>

    <section class="photographe_medias">
    </section>
  </main>
  <div id="contact_modal">
    <div class="modal">
      <header>
        <h1 class="modal_title">Contactez-moi</h1>
        <img src="assets/icons/close.svg" onclick="closeModal()" />
      </header>
      <form onsubmit="sendForm(event)">
        <div>
          <label>Prenom</label>
          <input type="text" name="firstname" required />
          <label>Nom</label>
          <input type="text" name="lastname" required />
          <label>Email</label>
          <input type="email" name="email" required />
          <label>Message</label>
          <textarea name="message" required cols="70" rows="10"></textarea>
        </div>
        <button type="submit" class="contact_button" onclick="sendForm(event)">Envoyer</button>
      </form>
    </div>
  </div>
</body>

</html>
